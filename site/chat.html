<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chats · LeaLink</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/lealink.css">
<script src="assets/js/lealink.js" defer></script>
<script src="assets/js/api.js" defer></script>
<script src="assets/js/pages/chat.js" defer></script>
</head>
<body data-role="learner" class="chat-page">
<header class="site-header" data-header="learner" data-active="chats"></header>

<main class="chat">
  <aside class="chat-list">
    <div class="chat-list-head">
      <h2>Chats</h2>
      <div class="input-icon"><i data-i="search"></i><input class="input" type="search" placeholder="Search conversations" aria-label="Search conversations" data-chat-search></div>
    </div>
    <div data-convs><p class="muted" style="padding:12px 16px">Loading…</p></div>
  </aside>

  <section class="chat-main" data-chat-main></section>
</main>

<dialog class="dialog" id="request-details" aria-labelledby="rd-title">
  <div class="dialog-head"><h2 id="rd-title">Request</h2><button class="icon-btn" type="button" data-close aria-label="Close"><i data-i="x"></i></button></div>
  <div class="dialog-body" data-request-details></div>
  <div class="dialog-foot"><button class="btn btn-secondary" type="button" data-close>Close</button></div>
</dialog>
</body>
</html>
