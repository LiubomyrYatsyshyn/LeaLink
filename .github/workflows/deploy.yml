name: Deploy

on:
  push:
    branches: [main]

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
    steps:
      - name: Check server config
        id: check
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && [ -n "$SERVER_SSH_KEY_B64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Server secrets are not set yet - skipping deploy."
          fi

      - name: Configure SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SERVER_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Validate SSH key
        if: steps.check.outputs.ready == 'true'
        run: ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Test SSH connection
        if: steps.check.outputs.ready == 'true'
        run: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" true

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/lealink && git fetch origin main && git reset --hard origin/main && docker compose up -d --build --remove-orphans"
